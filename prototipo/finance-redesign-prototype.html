<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance — Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
<style>
  :root{
    --ink:#0A0E0D;
    --surface:#121916;
    --surface-2:#182420;
    --surface-3:#1E2D28;
    --line:#243330;
    --text:#EDF2EF;
    --text-dim:#8FA39C;
    --text-faint:#5A6C66;
    --mint:#3DDC97;
    --mint-dim:#234339;
    --gold:#E8C468;
    --gold-dim:#3E3A22;
    --coral:#FF6B6B;
    --coral-dim:#3E2323;
    --radius:10px;
    --sans:'IBM Plex Sans',sans-serif;
    --display:'Space Grotesk',sans-serif;
    --mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  #app{display:flex; min-height:100vh;}
  ::selection{background:var(--mint-dim); color:var(--mint);}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:224px; flex-shrink:0;
    background:var(--surface);
    border-right:1px solid var(--line);
    padding:20px 14px;
    display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:4px 8px 22px 8px;}
  .brand-mark{
    width:30px; height:30px; border-radius:8px;
    background:linear-gradient(155deg, var(--mint), #1F9C6B);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--display); font-weight:700; color:#08120E; font-size:14px;
  }
  .brand-name{font-family:var(--display); font-weight:600; font-size:15px; letter-spacing:.2px;}
  .nav-label{font-size:10.5px; letter-spacing:1.4px; color:var(--text-faint); padding:14px 10px 8px; text-transform:uppercase;}
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding:9px 10px; border-radius:8px; margin-bottom:2px;
    color:var(--text-dim); font-size:13.5px; cursor:pointer;
    border-left:2px solid transparent;
    transition:background .12s ease, color .12s ease;
  }
  .nav-item svg{width:16px; height:16px; flex-shrink:0;}
  .nav-item:hover{background:var(--surface-2); color:var(--text);}
  .nav-item.active{background:var(--surface-2); color:var(--mint); border-left:2px solid var(--mint);}
  .nav-item.disabled{opacity:.4; cursor:not-allowed;}
  .nav-item.disabled:hover{background:transparent; color:var(--text-dim);}
  .nav-soon{margin-left:auto; font-size:9px; font-family:var(--mono); color:var(--text-faint); background:var(--surface-3); padding:2px 5px; border-radius:4px;}
  .sidebar-foot{margin-top:auto; padding-top:16px; border-top:1px solid var(--line);}
  .user-chip{display:flex; align-items:center; gap:9px; padding:8px; border-radius:8px;}
  .avatar{width:28px; height:28px; border-radius:50%; background:linear-gradient(155deg,var(--gold),#B98F3A); display:flex; align-items:center; justify-content:center; font-family:var(--display); font-size:11.5px; font-weight:700; color:#241C08;}
  .user-chip-name{font-size:12.5px; font-weight:500;}
  .user-chip-role{font-size:10.5px; color:var(--text-faint);}

  /* ---------- Main ---------- */
  .main{flex:1; min-width:0;}
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 30px; border-bottom:1px solid var(--line);
    position:sticky; top:0; background:rgba(10,14,13,.85); backdrop-filter:blur(6px); z-index:5;
  }
  .topbar h1{font-family:var(--display); font-size:19px; margin:0; font-weight:600;}
  .topbar-sub{font-size:12px; color:var(--text-faint); margin-top:2px;}
  .privacy-toggle{
    width:34px; height:34px; border-radius:8px; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-dim);
    background:var(--surface);
  }
  .privacy-toggle:hover{color:var(--text); border-color:var(--text-faint);}
  .content{padding:26px 30px 60px;}

  /* ---------- Hero / greeting ---------- */
  .hero{
    border:1px solid var(--line); border-radius:var(--radius);
    background:linear-gradient(120deg, var(--surface) 0%, var(--surface-2) 100%);
    padding:20px 24px; display:flex; align-items:center; justify-content:space-between;
    margin-bottom:20px;
  }
  .hero-greeting{font-family:var(--display); font-size:20px; font-weight:600;}
  .hero-sub{font-size:12.5px; color:var(--text-dim); margin-top:3px;}
  .hero-date{font-size:11.5px; color:var(--text-faint); font-family:var(--mono);}
  .btn{
    border:none; border-radius:8px; padding:9px 16px; font-size:13px; font-weight:600;
    cursor:pointer; display:inline-flex; align-items:center; gap:7px; font-family:var(--sans);
    transition:transform .08s ease, filter .12s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--mint); color:#06140E;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent; color:var(--text-dim); border:1px solid var(--line);}
  .btn-ghost:hover{color:var(--text); border-color:var(--text-faint);}
  .btn-danger{background:var(--coral); color:#2A0A0A;}
  .btn-warn{background:var(--gold); color:#241C08;}

  /* ---------- Stat cards ---------- */
  .stat-grid{display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:16px; margin-bottom:20px;}
  .stat-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 20px; position:relative; overflow:hidden;
  }
  .stat-card::before{content:''; position:absolute; left:0; top:0; bottom:0; width:3px;}
  .stat-card.c-mint::before{background:var(--mint);}
  .stat-card.c-coral::before{background:var(--coral);}
  .stat-card.c-gold::before{background:var(--gold);}
  .stat-label{font-size:10.5px; letter-spacing:1.1px; text-transform:uppercase; color:var(--text-faint); display:flex; align-items:center; gap:6px;}
  .stat-value{font-family:var(--mono); font-size:26px; font-weight:600; margin-top:8px; letter-spacing:-.3px; font-variant-numeric:tabular-nums;}
  .stat-foot{font-size:12px; color:var(--text-dim); margin-top:6px;}
  .pill{display:inline-flex; align-items:center; gap:4px; font-family:var(--mono); font-size:11.5px; padding:2px 7px; border-radius:20px; font-weight:600;}
  .pill.up{background:var(--mint-dim); color:var(--mint);}
  .pill.down{background:var(--coral-dim); color:var(--coral);}
  .spark{position:absolute; right:16px; bottom:14px; opacity:.85;}
  .privacy .stat-value, .privacy .money{filter:blur(7px); user-select:none;}

  /* ---------- Panels ---------- */
  .panel-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:20px;}
  .panel-head{display:flex; align-items:center; gap:8px; margin-bottom:16px;}
  .panel-head h3{font-family:var(--display); font-size:14.5px; margin:0; font-weight:600;}
  .donut-wrap{display:flex; align-items:center; gap:26px;}
  .legend-row{display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-top:1px solid var(--line);}
  .legend-row:first-of-type{border-top:none;}
  .legend-left{display:flex; align-items:center; gap:9px;}
  .dot{width:9px; height:9px; border-radius:2px;}
  .legend-name{font-size:13px; font-weight:500;}
  .legend-count{font-size:11px; color:var(--text-faint);}
  .legend-right{text-align:right;}
  .legend-value{font-family:var(--mono); font-size:13px; font-variant-numeric:tabular-nums;}
  .legend-pct{font-size:11px; color:var(--text-faint); font-family:var(--mono);}

  .mover-row{display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-top:1px solid var(--line);}
  .mover-row:first-of-type{border-top:none;}
  .mover-code{font-family:var(--mono); font-size:12.5px; font-weight:600;}
  .mover-name{font-size:11px; color:var(--text-faint);}

  /* ---------- Tables ---------- */
  .table-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
  .table-toolbar{display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--line); gap:12px; flex-wrap:wrap;}
  .tabs{display:flex; gap:4px; background:var(--surface-2); border-radius:8px; padding:3px;}
  .tab-btn{padding:6px 14px; border-radius:6px; font-size:12.5px; font-weight:600; color:var(--text-dim); cursor:pointer; border:none; background:transparent; font-family:var(--sans);}
  .tab-btn.active{background:var(--surface-3); color:var(--mint);}
  .search-input, select.select{
    background:var(--surface-2); border:1px solid var(--line); border-radius:7px;
    padding:8px 12px; color:var(--text); font-size:12.5px; font-family:var(--sans);
  }
  .search-input::placeholder{color:var(--text-faint);}
  .search-input:focus, select.select:focus, input:focus{outline:2px solid var(--mint-dim); outline-offset:1px;}

  table{width:100%; border-collapse:collapse;}
  thead th{
    text-align:left; font-size:10.5px; letter-spacing:.9px; text-transform:uppercase; color:var(--text-faint);
    padding:11px 18px; border-bottom:1px solid var(--line); font-weight:500; position:sticky; top:63px; background:var(--surface);
  }
  tbody td{padding:13px 18px; border-bottom:1px solid var(--line); font-size:13px;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr{transition:background .1s ease;}
  tbody tr:hover{background:var(--surface-2);}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums;}
  .code-cell{font-family:var(--mono); font-weight:600; letter-spacing:.2px;}
  .name-cell{color:var(--text-dim); font-size:12px;}
  .stamp{
    display:inline-block; font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:.6px;
    padding:3px 8px; border-radius:4px; text-transform:uppercase;
  }
  .stamp.fiis{background:var(--gold-dim); color:var(--gold);}
  .stamp.acao{background:var(--mint-dim); color:var(--mint);}
  .status-dot{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-dim);}
  .status-dot::before{content:''; width:6px; height:6px; border-radius:50%; background:var(--mint);}
  .status-dot.paused::before{background:var(--text-faint);}
  .row-actions{display:flex; gap:4px;}
  .icon-btn{
    width:28px; height:28px; border-radius:6px; border:1px solid transparent; background:transparent;
    color:var(--text-faint); display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .icon-btn:hover{background:var(--surface-3); color:var(--text);}
  .icon-btn.danger:hover{color:var(--coral); background:var(--coral-dim);}
  .icon-btn svg{width:14px; height:14px;}
  .type-badge{font-size:11px; font-weight:700; font-family:var(--mono); padding:3px 9px; border-radius:5px;}
  .type-badge.compra{background:var(--mint-dim); color:var(--mint);}
  .type-badge.venda{background:var(--coral-dim); color:var(--coral);}
  .empty-state{padding:60px 20px; text-align:center; color:var(--text-faint);}
  .empty-state svg{margin-bottom:10px; opacity:.5;}
  .empty-state p{font-size:13px; margin:4px 0;}

  /* ---------- Modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(6,9,8,.65); backdrop-filter:blur(2px);
    display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .modal{
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    width:100%; max-width:440px; padding:24px; box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  .modal-head h3{font-family:var(--display); font-size:16.5px; margin:0; display:flex; align-items:center; gap:9px;}
  .modal-close{background:none; border:none; color:var(--text-faint); cursor:pointer; padding:4px;}
  .modal-close:hover{color:var(--text);}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:11px; letter-spacing:.5px; text-transform:uppercase; color:var(--text-faint); margin-bottom:6px;}
  .field input{
    width:100%; background:var(--surface-2); border:1px solid var(--line); border-radius:7px;
    padding:10px 12px; color:var(--text); font-size:13.5px; font-family:var(--mono);
  }
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .segmented{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:16px;}
  .seg-btn{
    padding:10px; border-radius:8px; border:1px solid var(--line); background:var(--surface-2);
    color:var(--text-dim); font-weight:600; font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .seg-btn.compra.active{background:var(--mint-dim); border-color:var(--mint); color:var(--mint);}
  .seg-btn.venda.active{background:var(--coral-dim); border-color:var(--coral); color:var(--coral);}
  .modal-foot{display:flex; justify-content:flex-end; gap:10px; margin-top:18px;}
  .warn-box{
    background:var(--gold-dim); border:1px solid #4A431F; color:var(--gold);
    border-radius:8px; padding:12px 14px; font-size:12.5px; margin-bottom:16px; display:flex; gap:9px;
  }
  .warn-box svg{flex-shrink:0; margin-top:1px;}
  .color-row{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
  .swatch{width:34px; height:34px; border-radius:7px; flex-shrink:0; border:1px solid var(--line);}
  .field-hint{font-size:11px; color:var(--text-faint); margin-top:6px;}

  @media (max-width:920px){
    .stat-grid{grid-template-columns:1fr;}
    .panel-grid{grid-template-columns:1fr;}
    .sidebar{position:fixed; z-index:40; transform:translateX(-100%);}
  }
</style>
</head>

    const search = ref('');
    const catFilter = ref('TODAS');

    const showTransacao = ref(false);
    const showEditar = ref(false);
    const showPausar = ref(false);
    const activeAsset = ref(null);
    const txType = ref('COMPRA');

    const positions = reactive(seedPositions.map(p => ({...p, status:'ATIVO'})));
    const extrato = reactive(seedExtrato);

    const patrimonio = computed(() => positions.reduce((s,p)=> s + p.qtd*p.atual, 0));
    const investido  = computed(() => positions.reduce((s,p)=> s + p.qtd*p.pm, 0));
    const lucro = computed(() => patrimonio.value - investido.value);
    const lucroPct = computed(() => investido.value ? (lucro.value/investido.value*100) : 0);

    const categorias = computed(() => {
      const map = {};
      positions.forEach(p=>{
        map[p.cat] = map[p.cat] || {nome:p.cat, valor:0, count:0};
        map[p.cat].valor += p.qtd*p.atual;
        map[p.cat].count += 1;
      });
      const arr = Object.values(map);
      arr.forEach(c => c.pct = patrimonio.value ? (c.valor/patrimonio.value*100) : 0);
      return arr.sort((a,b)=> b.valor-a.valor);
    });

    const movers = computed(() => {
      return [...positions].map(p => ({...p, variacao: ((p.atual-p.pm)/p.pm*100)}))
        .sort((a,b)=> a.variacao - b.variacao).slice(0,4);
    });

    const filteredPositions = computed(() => {
      return positions.filter(p=>{
        const matchCat = catFilter.value==='TODAS' || p.cat===catFilter.value;
        const matchSearch = p.codigo.toLowerCase().includes(search.value.toLowerCase());
        return matchCat && matchSearch;
      });
    });

    function donutGradient(){
      let acc = 0; const stops = [];
      const colors = {FIIS:'#E8C468', ACAO:'#3DDC97'};
      categorias.value.forEach(c=>{
        const start = acc, end = acc + c.pct;
        stops.push(`${colors[c.nome]||'#8FA39C'} ${start}% ${end}%`);
        acc = end;
      });
      return `conic-gradient(${stops.join(',')})`;
    }

    function openTransacao(){ txType.value='COMPRA'; showTransacao.value = true; }
    function openEditar(asset){ activeAsset.value = {...asset}; showEditar.value = true; }
    function openPausar(asset){ activeAsset.value = asset; showPausar.value = true; }
    function confirmPausar(){
      if(activeAsset.value){ activeAsset.value.status = activeAsset.value.status==='ATIVO' ? 'PAUSADO' : 'ATIVO'; }
      showPausar.value = false;
    }

    return {
      view, privacyOn, carteiraTab, search, catFilter,
      showTransacao, showEditar, showPausar, activeAsset, txType,
      positions, extrato, patrimonio, investido, lucro, lucroPct,
      categorias, movers, filteredPositions,
      brl, pct, donutGradient,
      openTransacao, openEditar, openPausar, confirmPausar,
    };
